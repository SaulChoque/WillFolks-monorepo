# Flujo e2e para Maestro (https://maestro.dev): onboarding, faucet de prueba y primera meta de alarma.
#   N=$(date +%s); maestro test e2e/onboarding-and-first-goal.yaml -e EMAIL=nuevo$N@willfolks.test -e USERNAME=e2e$N
# EMAIL y USERNAME se pasan siempre con -e: un valor definido en `env:` de este archivo ganaría sobre -e.
# Requiere la app instalada en el emulador. Lo más fiable es un APK de release (JS embebido):
#   (cd android && env -u EXPO_PUBLIC_API_URL ./gradlew assembleRelease -PreactNativeArchitectures=x86_64)
#   adb install -r android/app/build/outputs/apk/release/app-release.apk
# La app usa el backend de Vercel salvo que EXPO_PUBLIC_API_URL esté definida al compilar o al
# arrancar Metro (ojo con esa variable en la shell). El APK de debug carga siempre Metro en
# 10.0.2.2:8081 e ignora el deep link expo-development-client.
# Los testID son los mismos que se usaron para recorrer la app con adb; este archivo en
# concreto todavía no se ha ejecutado con Maestro.
appId: com.anonymous.willfolksexpodapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: welcome-start
    timeout: 120000
- tapOn:
    id: welcome-start
- tapOn:
    id: signin-email
- inputText: ${EMAIL}
- tapOn:
    id: signin-name
- inputText: E2E
- hideKeyboard
- assertVisible:
    id: signin-server
    text: "(?i).*connected.*"
- tapOn:
    id: signin-submit
- tapOn:
    id: profile-username
- inputText: ${USERNAME}
- hideKeyboard
- tapOn:
    id: profile-submit
- tapOn:
    id: permissions-continue
- tapOn:
    id: wallet-finish
# Ya dentro de la app: con la cadena activa el saldo llega por el faucet de prueba (3 USD).
- tapOn: Home
- tapOn:
    id: home-wallet
- extendedWaitUntil:
    visible:
      id: chain-faucet
    timeout: 60000
- tapOn:
    id: chain-faucet
- extendedWaitUntil:
    visible: ".*\\+3 USD received.*"
    timeout: 180000
- assertVisible:
    id: tx-deposit
- tapOn:
    id: header-back
# Crear una meta de alarma con los valores por defecto.
- tapOn: Goals
- tapOn:
    id: goals-add
- tapOn:
    id: sheet-next
# La apuesta por defecto (5) supera lo recibido del faucet (3): se baja a 3.
- repeat:
    times: 2
    commands:
      - tapOn:
          id: goal-stake-less
- scrollUntilVisible:
    element:
      id: goal-submit
- tapOn:
    id: goal-submit
- assertVisible:
    id: goal-test-alarm
- assertVisible: 07:00
# Ningún texto técnico de cadena debe llegar a la pantalla.
- assertNotVisible: ".*USDC.*"
